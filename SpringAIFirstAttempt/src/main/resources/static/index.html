<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepSeek 流式对话</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .chat-container {
            width: 100%;
            max-width: 900px;
            height: 90vh;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: #2c3e50;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .chat-header h2 {
            margin: 0;
            font-size: 1.5rem;
        }

        .chat-header p {
            margin: 5px 0 0;
            opacity: 0.8;
            font-size: 0.85rem;
        }

        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f8f9fa;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            display: flex;
            gap: 10px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .user-message {
            justify-content: flex-end;
        }

        .bot-message {
            justify-content: flex-start;
        }

        .message-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }

        .user-avatar {
            background: #3498db;
            order: 2;
        }

        .bot-avatar {
            background: #2ecc71;
        }

        .message-bubble {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 0.95rem;
            line-height: 1.5;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .user-bubble {
            background: #3498db;
            color: white;
            border-bottom-right-radius: 5px;
        }

        .bot-bubble {
            background: white;
            color: #333;
            border: 1px solid #ddd;
            border-bottom-left-radius: 5px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        .cursor-blink {
            display: inline-block;
            width: 2px;
            height: 1.2em;
            background-color: #2ecc71;
            margin-left: 2px;
            animation: blink 1s step-end infinite;
            vertical-align: middle;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .input-area {
            padding: 20px;
            background: white;
            border-top: 1px solid #ddd;
        }

        .input-wrapper {
            display: flex;
            gap: 10px;
        }

        .input-wrapper input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #ddd;
            border-radius: 25px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }

        .input-wrapper input:focus {
            border-color: #3498db;
        }

        .send-btn {
            padding: 12px 24px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: background 0.3s;
        }

        .send-btn:hover:not(:disabled) {
            background: #2980b9;
        }

        .send-btn:disabled {
            background: #bdc3c7;
            cursor: not-allowed;
        }

        .stop-btn {
            background: #e74c3c;
        }

        .stop-btn:hover:not(:disabled) {
            background: #c0392b;
        }

        .welcome-message {
            text-align: center;
            padding: 40px;
            color: #7f8c8d;
        }

        .hide-welcome {
            display: none;
        }

        .debug-info {
            position: fixed;
            bottom: 10px;
            right: 10px;
            background: rgba(0,0,0,0.7);
            color: #0f0;
            font-family: monospace;
            font-size: 12px;
            padding: 5px 10px;
            border-radius: 5px;
            display: none;
        }
    </style>
</head>
<body>
<div class="chat-container">
    <div class="chat-header">
        <h2>🤖 DeepSeek AI 助手</h2>
        <p>流式对话 · 实时生成</p>
    </div>

    <div class="messages-area" id="messagesArea">
        <div class="welcome-message" id="welcomeMessage">
            <div>✨ 你好！我是 DeepSeek AI 助手</div>
            <div style="font-size: 14px; margin-top: 10px;">输入任何问题，我会实时流式回复~</div>
        </div>
    </div>

    <div class="input-area">
        <div class="input-wrapper">
            <input type="text" id="messageInput" placeholder="输入你的问题..." autocomplete="off">
            <button class="send-btn" id="sendBtn">发送</button>
            <button class="send-btn stop-btn" id="stopBtn" style="display: none;">停止</button>
        </div>
    </div>
</div>

<div class="debug-info" id="debugInfo"></div>

<script>
    const messagesArea = document.getElementById('messagesArea');
    const welcomeDiv = document.getElementById('welcomeMessage');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const stopBtn = document.getElementById('stopBtn');
    const debugInfo = document.getElementById('debugInfo');

    let currentReader = null;
    let isStreaming = false;
    let currentMessageDiv = null;
    let currentContentSpan = null;
    let fullContent = '';
    let receiveCount = 0;

    // 调试模式（可选）
    const DEBUG = true;

    function debugLog(msg) {
        if (DEBUG) {
            console.log(msg);
            debugInfo.textContent = msg;
            debugInfo.style.display = 'block';
            setTimeout(() => {
                debugInfo.style.display = 'none';
            }, 2000);
        }
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    function scrollToBottom() {
        messagesArea.scrollTop = messagesArea.scrollHeight;
    }

    function addUserMessage(text) {
        const messageDiv = document.createElement('div');
        messageDiv.className = 'message user-message';
        messageDiv.innerHTML = `
                <div class="message-bubble user-bubble">${escapeHtml(text)}</div>
                <div class="message-avatar user-avatar">👤</div>
            `;
        messagesArea.appendChild(messageDiv);
        scrollToBottom();
    }

    function createBotMessageContainer() {
        const messageDiv = document.createElement('div');
        messageDiv.className = 'message bot-message';
        const messageId = 'msg_' + Date.now();
        messageDiv.id = messageId;

        messageDiv.innerHTML = `
                <div class="message-avatar bot-avatar">🤖</div>
                <div class="message-bubble bot-bubble" id="bubble-${messageId}">
                    <span id="content-${messageId}"></span>
                    <span class="cursor-blink"></span>
                </div>
            `;

        messagesArea.appendChild(messageDiv);
        scrollToBottom();

        currentMessageDiv = messageDiv;
        currentContentSpan = document.getElementById(`content-${messageId}`);
        fullContent = '';
        receiveCount = 0;
    }

    function resetUI() {
        isStreaming = false;
        sendBtn.disabled = false;
        sendBtn.style.display = 'inline-flex';
        stopBtn.style.display = 'none';
        messageInput.disabled = false;
        messageInput.focus();
        currentReader = null;
        currentMessageDiv = null;
        currentContentSpan = null;
    }

    async function sendMessage() {
        const question = messageInput.value.trim();
        if (!question || isStreaming) return;

        messageInput.value = '';

        if (welcomeDiv && !welcomeDiv.classList.contains('hide-welcome')) {
            welcomeDiv.classList.add('hide-welcome');
        }

        addUserMessage(question);
        createBotMessageContainer();

        isStreaming = true;
        sendBtn.disabled = true;
        sendBtn.style.display = 'none';
        stopBtn.style.display = 'inline-flex';
        messageInput.disabled = true;

        try {
            debugLog('开始请求: ' + question);

            const response = await fetch(`http://127.0.0.1:8080/ai/chatStream?question=${encodeURIComponent(question)}`, {
                method: 'GET',
                headers: {
                    'Accept': 'text/event-stream',
                }
            });

            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }

            const reader = response.body.getReader();
            currentReader = reader;
            const decoder = new TextDecoder();
            let buffer = '';

            while (true) {
                const { done, value } = await reader.read();
                if (done) {
                    debugLog('流式传输结束');
                    break;
                }

                // 解码数据
                const chunk = decoder.decode(value, { stream: true });
                buffer += chunk;

                debugLog('收到原始数据: ' + chunk);

                // 按行分割
                let lines = buffer.split('\n');
                // 保留最后一个可能不完整的行
                buffer = lines.pop() || '';

                for (const line of lines) {
                    // 跳过空行
                    if (!line.trim()) continue;

                    debugLog('处理行: ' + line);

                    // 标准 SSE 格式：data:内容
                    if (line.startsWith('data:')) {
                        // 提取 data: 后面的内容
                        let data = line.substring(5); // 去掉 "data:"

                        // 去除可能的前后空格
                        data = data.trim();

                        debugLog('提取数据: ' + data);

                        // 检查结束标记
                        if (data === '[DONE]') {
                            debugLog('收到结束标记');
                            if (currentContentSpan) {
                                const cursor = currentContentSpan.nextElementSibling;
                                if (cursor && cursor.classList.contains('cursor-blink')) {
                                    cursor.remove();
                                }
                            }
                            break;
                        }

                        // 累加内容（直接拼接）
                        if (data) {
                            fullContent += data;
                            receiveCount++;

                            if (currentContentSpan) {
                                currentContentSpan.innerHTML = escapeHtml(fullContent);
                                scrollToBottom();
                                debugLog('当前总内容长度: ' + fullContent.length);
                            }
                        }
                    } else if (line.startsWith('event:')) {
                        // 处理事件类型（如果需要）
                        debugLog('事件类型: ' + line);
                    } else {
                        // 其他格式，直接作为数据
                        debugLog('非标准格式: ' + line);
                        if (line.trim()) {
                            fullContent += line;
                            if (currentContentSpan) {
                                currentContentSpan.innerHTML = escapeHtml(fullContent);
                                scrollToBottom();
                            }
                        }
                    }
                }
            }

            // 最终确保光标被移除
            if (currentContentSpan) {
                const cursor = currentContentSpan.nextElementSibling;
                if (cursor && cursor.classList.contains('cursor-blink')) {
                    cursor.remove();
                }
            }

            debugLog(`完成，共接收 ${receiveCount} 个数据块`);

        } catch (error) {
            console.error('Stream error:', error);
            debugLog('错误: ' + error.message);
            if (currentContentSpan) {
                currentContentSpan.innerHTML = `错误: ${error.message}`;
                const cursor = currentContentSpan.nextElementSibling;
                if (cursor) cursor.remove();
            }
        } finally {
            resetUI();
        }
    }

    function stopStream() {
        debugLog('手动停止流式传输');
        if (currentReader) {
            currentReader.cancel();
            currentReader = null;
        }

        if (currentContentSpan) {
            const cursor = currentContentSpan.nextElementSibling;
            if (cursor && cursor.classList.contains('cursor-blink')) {
                cursor.remove();
            }
        }

        resetUI();
    }

    // 事件监听
    sendBtn.addEventListener('click', sendMessage);
    stopBtn.addEventListener('click', stopStream);
    messageInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter' && !isStreaming) {
            sendMessage();
        }
    });

    // 可选：添加一个简单的测试按钮
    console.log('页面加载完成，等待输入...');
</script>
</body>
</html>
